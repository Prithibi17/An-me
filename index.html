<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>An:me Desktop</title>
    <link rel="icon" type="image/png" href="./anme-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000008;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      /* Custom sleek scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f121d;
      }
      ::-webkit-scrollbar-thumb {
        background: #252a3d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b4260;
      }
      /* Electron frameless window drag styles */
      .app-drag-region {
        -webkit-app-region: drag;
      }
      .app-no-drag {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body class="bg-[#000008] text-slate-100 antialiased selection:bg-purple-600 selection:text-white">
    <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
