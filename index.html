<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>An:me Desktop</title>
    <link rel="icon" type="image/png" href="./anme-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000008;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      /* Custom sleek scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f121d;
      }
      ::-webkit-scrollbar-thumb {
        background: #252a3d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b4260;
      }
      /* Electron frameless window drag styles */
      .app-drag-region {
        -webkit-app-region: drag;
      }
      .app-no-drag {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body class="bg-[#000008] text-slate-100 antialiased selection:bg-purple-600 selection:text-white">
    <div id="root" class="h-screen w-screen flex flex-col overflow-hidden">
      <!-- Instant 0ms Pre-Hydration Splash Frame -->
      <div id="instant-pre-splash" style="position:fixed;inset:0;background-color:#000008;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="position:relative;width:100%;max-width:860px;aspect-ratio:1024/576;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <div style="position:absolute;width:540px;height:380px;border-radius:9999px;background:radial-gradient(circle,rgba(236,72,153,0.3) 0%,rgba(56,189,248,0.2) 50%,transparent 70%);filter:blur(100px);pointer-events:none;"></div>
          <div style="position:absolute;left:41.01%;top:19.10%;width:18.07%;height:19.44%;">
            <img src="./splash/splash-logo.png" alt="An:me" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 22px rgba(236,72,153,0.75));" />
          </div>
          <div style="position:absolute;left:31.45%;top:50.69%;width:4.10%;height:11.11%;">
            <img src="./splash/bracket-left.png" alt="[" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 12px rgba(56,189,248,0.7));" />
          </div>
          <div style="position:absolute;left:64.06%;top:50.69%;width:4.10%;height:11.11%;">
            <img src="./splash/bracket-right.png" alt="]" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 12px rgba(244,63,94,0.7));" />
          </div>
          <div style="position:absolute;left:35.74%;top:43.75%;width:9.67%;height:25.69%;display:flex;align-items:center;justify-content:center;">
            <img src="./splash/card-blue.png" alt="" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(56,189,248,0.7));" />
          </div>
          <div style="position:absolute;left:44.92%;top:43.40%;width:10.06%;height:26.74%;display:flex;align-items:center;justify-content:center;">
            <img src="./splash/dashed-placeholder.png" alt="" style="width:100%;height:100%;object-fit:contain;opacity:0.4;" />
          </div>
          <div style="position:absolute;left:53.71%;top:44.10%;width:9.86%;height:26.39%;display:flex;align-items:center;justify-content:center;">
            <img src="./splash/dashed-placeholder.png" alt="" style="width:100%;height:100%;object-fit:contain;opacity:0.4;" />
          </div>
          <div style="position:absolute;left:45.90%;top:74.65%;width:8.20%;height:4.17%;display:flex;align-items:center;justify-content:space-between;">
            <div style="width:8px;height:8px;border-radius:9999px;background:#38bdf8;box-shadow:0 0 10px #38bdf8;"></div>
            <div style="width:10px;height:10px;border-radius:9999px;background:rgba(255,255,255,0.2);"></div>
            <div style="width:8px;height:8px;border-radius:9999px;background:rgba(255,255,255,0.2);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
